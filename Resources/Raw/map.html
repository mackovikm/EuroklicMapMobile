<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EuroklicMap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #e8eaf0; }
    #map { height: 100%; width: 100%; }

    /* Popup */
    .lf-popup-title   { font-weight: 700; font-size: 15px; margin-bottom: 4px; color: #1a1a1a; }
    .lf-popup-type    { display:inline-block; font-size: 11px; color: #fff;
                        text-transform: uppercase; letter-spacing:.5px;
                        padding: 1px 7px; border-radius: 10px; margin-bottom:6px; }
    .lf-popup-address { font-size: 12px; color: #444; margin-bottom: 4px; user-select: none; -webkit-user-select: none; cursor: pointer; }
    .lf-popup-desc    { font-size: 13px; color: #222; border-top: 1px solid #eee; padding-top: 6px; margin-top:4px; }
    .lf-popup-coords  { font-size: 11px; color: #888; font-family: monospace; margin-top: 6px; border-top: 1px solid #eee; padding-top: 5px; user-select: none; -webkit-user-select: none; cursor: pointer; }

    /* "Zadna data" */
    #empty-msg {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,.93); border-radius: 12px;
      padding: 20px 28px; text-align: center;
      font-family: sans-serif; color: #555; z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    #empty-msg .icon { font-size: 36px; margin-bottom: 8px; }
    #empty-msg p { font-size: 14px; margin: 0; }

    /* GPS pulsujici bod */
    .gps-dot {
      width: 14px; height: 14px;
      background: #1565C0; border: 3px solid white; border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(21,101,192,.25), 0 2px 6px rgba(0,0,0,.3);
    }

    /* Wrapper markeru - bez Leaflet defaultniho pozadi */
    .mp-marker { background: transparent !important; border: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="empty-msg">
    <div class="icon">🗺️</div>
    <p>Zadna data k zobrazeni.</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    /* ── Inicializace mapy ── */
    var map = L.map('map', { center: [49.8, 15.5], zoom: 7, zoomControl: true });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    var markersLayer = L.layerGroup().addTo(map);
    var markersById  = {};   // id → Leaflet marker (pro focusPoint)
    var gpsMarker    = null;
    var clickMarker  = null; // oranžový bod po kliknutí do mapy

    /* ── Typy bodů – shodné s webovou aplikací (app.js ICON_TYPES) ── */
    var ICON_TYPES = {
      'default':      { label: 'Obecny',             color: '#3b82f6', emoji: ''    },
      'monument':     { label: 'Pamatka',             color: '#7c3aed', emoji: '★' },
      'restaurant':   { label: 'Restaurace',          color: '#ea580c', emoji: '🍴' },
      'hotel':        { label: 'Ubytovani',           color: '#facc15', emoji: '🛏' },
      'nature':       { label: 'Priroda',             color: '#16a34a', emoji: '🌲' },
      'transport':    { label: 'Doprava',             color: '#0891b2', emoji: '🚌' },
      'shop':         { label: 'Obchod',              color: '#db2777', emoji: '🛗' },
      'WC':           { label: 'Toaleta',             color: '#38bdf8', emoji: '🚻' },
      'Plošina':      { label: 'Plošina',            color: '#f97316', emoji: '♿'  },
      'Plošina + WC': { label: 'Toaleta a plošina', color: '#38f8bb', emoji: '🚻♿' },
      'Výtah':        { label: 'Výtah',              color: '#a855f7', emoji: '🛗' },
      'Brána':        { label: 'Brána',              color: '#92400e', emoji: '⛩️' },
      'Parkoviště':  { label: 'Parkoviště',  color: '#1d4ed8', emoji: '🅿️' },
      'Dveře':       { label: 'Dveře',        color: '#78716c', emoji: '🚪' },
      'Sprcha':      { label: 'Sprcha',       color: '#0e7490', emoji: '🚿' },
      'Závora':      { label: 'Závora',       color: '#f59e0b', emoji: '🚧' },
      'other':        { label: 'Ostatni',             color: '#6b7280', emoji: '?'   }
    };

    /* ── Hash barva pro neznamy typ (mirror JS colorFromString) ── */
    function colorFromString(str) {
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0; // 32-bit int
      }
      var hue = Math.abs(hash) % 360;
      return hslToHex(hue, 65, 45);
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      var k = function(n) { return (n + h / 30) % 12; };
      var a = s * Math.min(l, 1 - l);
      var channel = function(n) {
        var c = l - a * Math.max(-1, Math.min(Math.min(k(n) - 3, 9 - k(n)), 1));
        return Math.round(255 * c).toString(16).padStart(2, '0');
      };
      return '#' + channel(0) + channel(8) + channel(4);
    }

    function getTypeMeta(type) {
      if (!type) return ICON_TYPES['default'];
      if (ICON_TYPES[type]) return ICON_TYPES[type];
      return { label: type, color: colorFromString(type), emoji: '?' };
    }

    /* ── SVG pin marker – stejny tvar jako webova aplikace ── */
    function makePinSvg(color, emoji) {
      var safeColor = String(color).replace(/[^#0-9a-zA-Z]/g, '');
      var safeEmoji = (emoji || '').substring(0, 4);
      var innerLabel = safeEmoji
        ? '<text x="15" y="19" text-anchor="middle" font-size="13" font-family="Segoe UI Emoji,Apple Color Emoji,Arial">' + safeEmoji + '</text>'
        : '<circle cx="15" cy="15" r="5" fill="white"/>';
      return '<svg width="30" height="42" viewBox="0 0 30 42" xmlns="http://www.w3.org/2000/svg">'
        + '<path d="M15 0 C7 0 0 7 0 15 C0 26 15 42 15 42 C15 42 30 26 30 15 C30 7 23 0 15 0 Z"'
        + ' fill="' + safeColor + '" stroke="#1f2937" stroke-width="1"/>'
        + innerLabel
        + '</svg>';
    }

    /* ── Leaflet ikona bodu ── */
    function buildLeafletIcon(point) {
      if (point.iconUrl) {
        return L.divIcon({
          className: 'mp-marker',
          html: '<img src="' + point.iconUrl + '" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.4)" alt="">',
          iconSize: [32,32], iconAnchor: [16,32], popupAnchor: [0,-34]
        });
      }
      var meta = getTypeMeta(point.type);
      return L.divIcon({
        className: 'mp-marker',
        html: makePinSvg(meta.color, meta.emoji),
        iconSize: [30,42], iconAnchor: [15,42], popupAnchor: [0,-44]
      });
    }

    /* ── Popup HTML ── */
    function buildPopup(p) {
      var meta = getTypeMeta(p.type);
      var html = '<div class="lf-popup-title">' + esc(p.name) + '</div>';
      if (p.type) {
        html += '<div class="lf-popup-type" style="background:' + meta.color + '">'
              + esc(meta.label) + '</div>';
      }
      if (p.address)     html += '<div class="lf-popup-address">&#128205; ' + esc(p.address) + '</div>';
      if (p.description) html += '<div class="lf-popup-desc">' + esc(p.description) + '</div>';
      html += '<div class="lf-popup-coords"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><path d="M12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/></svg>' + p.latitude.toFixed(5) + ', ' + p.longitude.toFixed(5) + '</div>';
      return html;
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ── loadPoints – volano z MAUI po nacteni/filtrovani dat ── */
    function loadPoints(jsonStr) {
      markersLayer.clearLayers();
      markersById = {};
      var points;
      try { points = JSON.parse(jsonStr); } catch(e) { showEmpty(true); return; }
      if (!Array.isArray(points) || points.length === 0) { showEmpty(true); return; }
      showEmpty(false);

      points.forEach(function(p) {
        var icon   = buildLeafletIcon(p);
        var popup  = buildPopup(p);
        var marker = L.marker([p.latitude, p.longitude], { icon: icon })
          .bindPopup(popup, { maxWidth: 280, autoPan: true })
          .addTo(markersLayer);

        markersById[p.id] = marker;

        marker.on('click', function() {
          map.setView([p.latitude, p.longitude], 14, { animate: true, duration: 0.5 });
        });
      });

      if (!window._gpsSet) {
        try {
          var bounds = markersLayer.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [40,40], maxZoom: 14 });
            // moveend fires automaticky po animaci fitBounds
          } else {
            notifyBounds();
          }
        } catch(_) { notifyBounds(); }
      } else {
        // GPS je nastaven, mapa se nehybala → notifikuj ihned
        notifyBounds();
      }
    }

    /* ── focusPoint – volano z MAUI při kliknutí na položku seznamu ── */
    function focusPoint(id) {
      var marker = markersById[id];
      if (!marker) return;
      var ll = marker.getLatLng();
      map.setView(ll, Math.max(map.getZoom(), 15), { animate: true, duration: 0.5 });
      setTimeout(function() { marker.openPopup(); }, 400);
    }

    /* ── Notifikace hranic výřezu → MAUI seznam bodů ── */
    function notifyBounds() {
      if (!map) return;
      var b = map.getBounds();
      var url = 'maui://bounds?n=' + b.getNorth().toFixed(6)
              + '&s=' + b.getSouth().toFixed(6)
              + '&e=' + b.getEast().toFixed(6)
              + '&w=' + b.getWest().toFixed(6);
      try { window.location.href = url; } catch(_) {}
    }

    /* ── Klik do mapy → oranžový bod + vycentrování + notifikace MAUI ── */
    map.on('click', function(e) {
      if (clickMarker) map.removeLayer(clickMarker);
      clickMarker = L.circleMarker([e.latlng.lat, e.latlng.lng], {
        radius: 8,
        color: '#c2410c', weight: 2,
        fillColor: '#f97316', fillOpacity: 0.85,
        bubblingMouseEvents: false
      }).addTo(map);
      map.panTo([e.latlng.lat, e.latlng.lng]);

      // Informuj MAUI o novém referenčním bodu pro výpočet vzdáleností
      try {
        window.location.href = 'maui://location?lat=' + e.latlng.lat.toFixed(6)
                             + '&lng=' + e.latlng.lng.toFixed(6);
      } catch(_) {}
    });

    map.on('moveend', notifyBounds);
    map.on('zoomend', notifyBounds);

    /* ── GPS: vystred mapu na uzivatelovu polohu ── */
    function centerOnGps(lat, lng) {
      window._gpsSet = true;
      if (gpsMarker) map.removeLayer(gpsMarker);
      var gpsIcon = L.divIcon({
        html: '<div class="gps-dot"></div>',
        className: '', iconSize:[14,14], iconAnchor:[7,7]
      });
      gpsMarker = L.marker([lat, lng], { icon: gpsIcon, zIndexOffset: 1000 })
        .bindPopup('<b>Vase poloha</b>')
        .addTo(map);
      map.setView([lat, lng], 14, { animate: true, duration: 0.8 });
    }

    function showEmpty(visible) {
      document.getElementById('empty-msg').style.display = visible ? 'block' : 'none';
    }

    /* ── Long-press kopírování v popupu → MAUI clipboard ── */
    (function() {
      var LONG_MS = 600;
      var _timer = null;

      function attachCopy(el, getText) {
        el.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        el.addEventListener('touchstart', function(e) {
          _timer = setTimeout(function() {
            _timer = null;
            var text = getText();
            if (text) {
              try { window.location.href = 'maui://copy?text=' + encodeURIComponent(text); } catch(_) {}
              el.style.opacity = '0.5';
              setTimeout(function() { el.style.opacity = ''; }, 300);
            }
          }, LONG_MS);
        }, { passive: true });
        el.addEventListener('touchend',   function() { clearTimeout(_timer); _timer = null; }, { passive: true });
        el.addEventListener('touchmove',  function() { clearTimeout(_timer); _timer = null; }, { passive: true });
      }

      /* Napoj se na každý nově otevřený popup */
      map.on('popupopen', function(ev) {
        var node = ev.popup.getElement();
        var addrEl   = node.querySelector('.lf-popup-address');
        var coordsEl = node.querySelector('.lf-popup-coords');
        if (addrEl)   attachCopy(addrEl,   function() { return addrEl.innerText.replace(/^[^\w]+/, '').trim(); });
        if (coordsEl) attachCopy(coordsEl, function() { return coordsEl.innerText.trim(); });
      });
    })();

    window.mapReady = true;
  </script>
</body>
</html>
